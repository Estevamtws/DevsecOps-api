name: Pipeline DevSecOps

# Dispara o pipeline em push/PR para a main, ou manualmente pela aba Actions.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Por padrao os jobs so podem ler o repositorio. Jobs que precisam de mais
# (ex.: publicar pacotes) declaram sua propria permissao especifica.
permissions:
  contents: read

env:
  IMAGEM: ${{ github.repository }}

jobs:

  # ---------------------------------------------------------------------------
  # Job 1: procura segredos (senhas, chaves, tokens) commitados no historico
  # do Git. Se algum segredo for encontrado, o pipeline para aqui mesmo.
  # ---------------------------------------------------------------------------
  segredos:
    name: "1. Segredos (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo (historico completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar o binario do Gitleaks
        run: |
          VERSAO="8.21.2"
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSAO}/gitleaks_${VERSAO}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks

      - name: Rodar Gitleaks em todo o historico do repositorio
        run: ./gitleaks git . --redact --verbose

  # ---------------------------------------------------------------------------
  # Job 2: analise estatica de seguranca (SAST). Le o codigo-fonte sem
  # executa-lo, procurando por padroes de codigo inseguro (ex.: SQL Injection).
  # ---------------------------------------------------------------------------
  sast:
    name: "2. SAST (Semgrep)"
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Rodar Semgrep com as regras padrao de C# e as regras proprias do projeto
        run: semgrep scan --config p/csharp --config .semgrep/regras.yml --severity ERROR --error

  # ---------------------------------------------------------------------------
  # Job 3: compila o projeto e executa os testes automatizados. Garante que
  # o codigo funciona antes de seguir para as etapas seguintes do pipeline.
  # ---------------------------------------------------------------------------
  build-e-testes:
    name: "3. Build e testes"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar o .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache de pacotes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}

      - name: Compilar a solucao
        run: dotnet build DevSecOps.sln --configuration Release

      - name: Executar os testes automatizados
        run: dotnet test DevSecOps.sln --configuration Release --no-build

  # ---------------------------------------------------------------------------
  # Job 4: gera o SBOM (lista de todas as dependencias do projeto, como um
  # "rotulo de ingredientes") e usa o Trivy para checar se alguma dependencia
  # tem vulnerabilidade critica conhecida e ja corrigida pelo fornecedor.
  # ---------------------------------------------------------------------------
  dependencias-sbom:
    name: "4. Dependencias e SBOM (Trivy)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar o .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # O Trivy le as dependencias do arquivo packages.lock.json, que lista
      # todos os pacotes NuGet (diretos e indiretos) com a versao exata.
      # Sem esse arquivo o Trivy nao enxerga nenhuma dependencia do projeto.
      - name: Gerar a lista exata de dependencias (packages.lock.json)
        run: dotnet restore src/DevSecOpsApi/DevSecOpsApi.csproj --use-lock-file

      - name: Gerar SBOM em formato CycloneDX
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" aquasec/trivy fs \
            --format cyclonedx \
            --output /src/sbom.json \
            /src

      - name: Publicar o SBOM como artefato do workflow
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

      - name: Procurar vulnerabilidades criticas e corrigiveis nas dependencias
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" aquasec/trivy fs \
            --scanners vuln \
            --severity CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            /src

  # ---------------------------------------------------------------------------
  # Job 5: analisa o Dockerfile (IaC = Infraestrutura como Codigo) procurando
  # praticas inseguras, como rodar o container como usuario root.
  # ---------------------------------------------------------------------------
  iac-dockerfile:
    name: "5. IaC / Dockerfile (Checkov)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Rodar Checkov no Dockerfile
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" bridgecrew/checkov \
            -d /src --framework dockerfile --skip-path demonstracoes --compact

  # ---------------------------------------------------------------------------
  # Job 6: builda a imagem Docker final, escaneia essa imagem com o Trivy
  # (procurando vulnerabilidades no sistema operacional da imagem) e depois
  # sobe a aplicacao de verdade para rodar um teste dinamico (DAST) com o
  # OWASP ZAP, simulando ataques reais contra a API em execucao.
  # ---------------------------------------------------------------------------
  imagem-e-dast:
    name: "6. Imagem (Trivy) e DAST (OWASP ZAP)"
    runs-on: ubuntu-latest
    needs:
      - segredos
      - sast
      - build-e-testes
      - dependencias-sbom
      - iac-dockerfile
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Build da imagem Docker
        run: docker build -t api-devsecops:teste .

      - name: Escanear a imagem Docker com Trivy
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy image \
            --severity CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            api-devsecops:teste

      - name: Subir o container da API
        run: docker run -d --name api-teste -p 8080:8080 api-devsecops:teste

      - name: Esperar a API ficar saudavel (/actuator/health)
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/actuator/health > /dev/null; then
              echo "API no ar."
              exit 0
            fi
            echo "Aguardando a API iniciar... ($i)"
            sleep 2
          done
          echo "A API nao respondeu a tempo."
          docker logs api-teste
          exit 1

      - name: Rodar DAST com OWASP ZAP (zap-api-scan)
        run: |
          # O ZAP roda com outro usuario dentro do container, entao criamos uma
          # pasta com permissao de escrita para ele ler as regras e gravar o relatorio.
          mkdir -p zap && cp .zap/rules.tsv zap/ && chmod -R 777 zap
          docker run --rm --network host \
            -v "${{ github.workspace }}/zap:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py \
            -t http://localhost:8080/v3/api-docs \
            -f openapi \
            -c rules.tsv \
            -I \
            -r relatorio-zap.html

      - name: Publicar o relatorio do ZAP como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-zap
          path: zap/relatorio-zap.html

      - name: Parar e remover o container de teste
        if: always()
        run: docker rm -f api-teste || true

  # ---------------------------------------------------------------------------
  # Job 7: so roda em push na branch main (nunca em pull request). Publica a
  # imagem final no GitHub Container Registry e assina essa imagem com o
  # Cosign, garantindo que ela nao foi alterada por ninguem depois de
  # publicada (seguranca da cadeia de suprimentos de software).
  # ---------------------------------------------------------------------------
  publicar-e-assinar:
    name: "7. Publicar e assinar imagem (Cosign)"
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - imagem-e-dast
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir nome da imagem em minusculas
        id: nome-imagem
        run: echo "imagem=ghcr.io/$(echo '${{ env.IMAGEM }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build e push da imagem (tags latest e SHA)
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.nome-imagem.outputs.imagem }}:latest
            ${{ steps.nome-imagem.outputs.imagem }}:${{ github.sha }}

      - name: Instalar o Cosign
        uses: sigstore/cosign-installer@v3

      - name: Assinar a imagem publicada (pelo digest)
        run: cosign sign --yes "${{ steps.nome-imagem.outputs.imagem }}@${{ steps.build-push.outputs.digest }}"

      - name: Verificar a assinatura da imagem
        run: cosign verify "${{ steps.nome-imagem.outputs.imagem }}@${{ steps.build-push.outputs.digest }}" \
          --certificate-identity-regexp "https://github.com/${{ github.repository }}/.*" \
          --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
